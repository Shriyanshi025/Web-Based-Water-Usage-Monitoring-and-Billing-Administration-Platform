spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/water_monitoring_db}
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:postgres}

jwt.secret=${JWT_SECRET}

frontend.base-url=${FRONTEND_URL:http://localhost:5173}

spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.from=${SPRING_MAIL_FROM}
