# Render Deployment Configuration for HydroSync Backend & Frontend

services:
  # Backend Service Configuration (Render Web Service)
  - type: web
    name: hydrosync-backend
    env: java
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/monitoring-and-billing-platform-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://web-based-water-usage-monitoring-an.vercel.app
    healthCheckPath: /api/health
    autoDeploy: true

  # Static Site Frontend Configuration (Render Static Site)
  - type: web
    name: hydrosync-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    autoDeploy: true
