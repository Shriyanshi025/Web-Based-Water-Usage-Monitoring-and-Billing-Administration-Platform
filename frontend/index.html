<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HydroSync — Water Usage Monitoring & Billing Administration</title>
    <meta name="description" content="HydroSync is a smart water usage monitoring and billing administration platform for residential communities." />

    <!-- Google Fonts: Inter (UI) + JetBrains Mono (IDs, meters, amounts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Hide all Google Translate top toolbar banner elements completely */
      .goog-te-banner-frame,
      .goog-te-banner,
      .skiptranslate.goog-te-gadget-simple,
      iframe.goog-te-banner-frame,
      iframe[id=":2.container"],
      iframe.VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-OR2L6d-2b0bBv,
      .VIpgJd-ZVi9od-ORHb-OEVmcd {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      /* Force body and html to stay at top without push offset */
      body, html {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
        padding-top: 0px !important;
      }
      .goog-te-menu-value span {
        text-decoration: none !important;
      }
      #goog-gt-tt, .goog-te-balloon-frame {
        display: none !important;
      }
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
    </style>
    <script type="text/javascript">
      // MutationObserver to continuously clean up Google Translate top iframe and body top style
      (function() {
        var observer = new MutationObserver(function() {
          if (document.body && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          var banner = document.getElementById(':2.container') || document.querySelector('iframe.VIpgJd-ZVi9od-ORHb-OEVmcd');
          if (banner) {
            banner.style.display = 'none';
            banner.style.visibility = 'hidden';
            banner.style.height = '0px';
          }
        });
        observer.observe(document.documentElement, {
          attributes: true,
          childList: true,
          subtree: true,
          attributeFilter: ['style', 'class']
        });
      })();
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false,
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
